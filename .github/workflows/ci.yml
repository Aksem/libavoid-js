name: CI

on:
  push:
  pull_request:
    types: [opened, reopened]

defaults:
  run:
    shell: bash

jobs:
  CI:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set up Python 3.11.6
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.6

      - name: Build
        run: |
          npm install
          python3.11 ./tools/generate.py

      - name: Upload artifact(production bindings)
        uses: actions/upload-artifact@v4
        with:
          name: production-bindings
          path: |
            src/generated/

      - name: Upload artifact(debug bindings)
        uses: actions/upload-artifact@v4
        with:
          name: debug-bindings
          path: |
            examples/lib/

  Test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test (node + chromium)
        run: npm test

  LeakCheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11.6
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Leak check
        run: npm run leakcheck
